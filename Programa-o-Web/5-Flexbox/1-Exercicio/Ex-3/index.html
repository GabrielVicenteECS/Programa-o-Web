<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Revisão Flexbox</title>
</head>
<body>
    <header class="linha superior">
        <div class="caixa caixa-top">Topo A</div>
        <div class="caixa caixa-top">Topo B</div>
        <div class="caixa caixa-top">Topo C</div>
    </header>

    <main class="linha central">
        <section class="caixa caixa-mid conteudo-principal">Conteúdo Principal(2/3)</section>
        <section class="caixa caixa-mid barra-lateral">Barra lateral (1/3)</section>
    </main>

    <footer class="linha inferior">
        <section class="caixa caixa-bot">Card 2</section>
        <section class="caixa caixa-bot">Card 1</section>
        <section class="caixa caixa-bot">Card 3</section>
        <section class="caixa caixa-bot">Card 4</section>
    </footer>
</body>
</html>
